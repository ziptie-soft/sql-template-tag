version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    ignore:
      # v10 needs conventional-changelog-writer@9, but the stable
      # @semantic-release/release-notes-generator (14.x) still ships writer@8.
      # Lift this once release-notes-generator 15 is out.
      - dependency-name: 'conventional-changelog-conventionalcommits'
        update-types: ['version-update:semver-major']
    groups:
      production-major:
        dependency-type: 'production'
        update-types:
          - 'major'
      all-minor-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    commit-message:
      prefix: 'fix'
      prefix-development: 'chore'
      include: 'scope'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    groups:
      all-actions:
        patterns:
          - '*'
    commit-message:
      prefix: 'chore'
      include: 'scope'
